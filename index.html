<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tối Ưu Độ Nhạy Free Fire Multi-Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: #0d0f12;
            background-image: radial-gradient(circle at 50% 0%, #2a0845 0%, #0d0f12 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 20px;
            padding: 30px 25px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 71, 87, 0.15);
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.6);
        }

        .title span {
            color: #ff4757;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #a4b0be;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background: #161d24;
            border: 1px solid #2f3542;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #ff4757;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.3);
        }

        /* Styling cho danh sách Checkbox */
        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #161d24;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #2f3542;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #ccc;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #ff4757;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
        }

        .result-card {
            display: none;
            margin-top: 25px;
            background: #12181f;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2f3542;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #2f3542;
            padding-bottom: 10px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .result-header span {
            color: #ff4757;
            font-weight: bold;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-item {
            background: #1a222d;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-size: 12px;
            color: #a4b0be;
        }

        .stat-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: bold;
            color: #2ed573;
        }

        .tip-box {
            margin-top: 15px;
            background: rgba(255, 171, 0, 0.1);
            border-left: 3px solid #ffab00;
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
            font-size: 12px;
            color: #eccc68;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">Độ Nhạy <span>FF Pro</span></div>

    <div class="input-group">
        <label for="device">Dòng Điện Thoại</label>
        <input type="text" id="device" placeholder="VD: iPhone 11, Samsung A54...">
    </div>

    <div class="input-group">
        <label for="dpi">Chỉ Số DPI Hiện Tại</label>
        <input type="number" id="dpi" placeholder="Nhập DPI" value="764">
    </div>

    <div class="input-group">
        <label>Chọn Tình Trạng Khi Bắn (Có thể chọn nhiều):</label>
        <div class="checkbox-grid">
            <label class="checkbox-item"><input type="checkbox" value="nang_tam"> Nặng tâm</label>
            <label class="checkbox-item"><input type="checkbox" value="lo_dau"> Lố đầu</label>
            <label class="checkbox-item"><input type="checkbox" value="giat_tam"> Giật tâm</label>
            <label class="checkbox-item"><input type="checkbox" value="rung_tay"> Rung tay</label>
            <label class="checkbox-item"><input type="checkbox" value="lac_dan"> Lạc đạn</label>
            <label class="checkbox-item"><input type="checkbox" value="truot_dich"> Trượt địch</label>
        </div>
    </div>

    <button onclick="tinhDoNhay()">TÍNH ĐỘ NHẠY NGHỆ</button>

    <div id="resultBox" class="result-card">
        <div class="result-header">
            <div>Thành phần: <span id="resDevice"></span></div>
            <div>DPI: <span id="resDpi"></span></div>
        </div>

        <div class="stat-grid">
            <div class="stat-item"><span class="stat-label">Nhìn xung quanh</span><span id="resLook" class="stat-val">0</span></div>
            <div class="stat-item"><span class="stat-label">Red Dot Sight</span><span id="resRedDot" class="stat-val">0</span></div>
            <div class="stat-item"><span class="stat-label">Ống ngắm 2x</span><span id="res2x" class="stat-val">0</span></div>
            <div class="stat-item"><span class="stat-label">Ống ngắm 4x</span><span id="res4x" class="stat-val">0</span></div>
            <div class="stat-item" style="grid-column: span 2;"><span class="stat-label">Kích thước nút bắn</span><span id="resButton" class="stat-val" style="color: #ff4757;">0%</span></div>
        </div>

        <div id="resTip" class="tip-box"></div>
    </div>
</div>

<script>
function tinhDoNhay() {
    let device = document.getElementById("device").value || "Thiết bị chung";
    let dpi = parseInt(document.getElementById("dpi").value) || 400;

    // Lấy danh sách các ô checkbox được chọn
    let selectedBoxes = document.querySelectorAll('.checkbox-grid input[type="checkbox"]:checked');
    let selectedStatuses = Array.from(selectedBoxes).map(cb => cb.value);

    // Chỉ số gốc theo DPI
    let look = Math.max(60, Math.min(100, Math.round(100 - (dpi - 360) * 0.04)));
    let redDot = look - 5;
    let scope2x = look - 8;
    let scope4x = look - 15;
    let btnSize = 45;
    let tips = [];

    if (selectedStatuses.length === 0) {
        tips.push("Mẹo: Hãy chọn ít nhất 1 tình trạng để máy tính tối ưu chuẩn nhất.");
    }

    // Duyệt qua từng tình trạng được tích chọn để điều chỉnh thông số
    selectedStatuses.forEach(status => {
        switch(status) {
            case "nang_tam":
                look += 6; redDot += 5; btnSize -= 2;
                tips.push("• **Nặng tâm:** Hạ nút bắn thấp xuống chút và vuốt lực mạnh hơn.");
                break;
            case "lo_dau":
                look -= 5; redDot -= 6; btnSize += 3;
                tips.push("• **Lố đầu:** Tăng nút bắn to lên để kìm lực kéo.");
                break;
            case "giat_tam":
                look -= 3; redDot -= 4;
                tips.push("• **Giật tâm:** Hạ nhẹ DPI trên hệ thống nếu còn bị nảy.");
                break;
            case "rung_tay":
                look -= 4; redDot -= 4; btnSize += 4;
                tips.push("• **Rung tay:** Tăng kích thước nút bắn làm điểm tựa ngón tay.");
                break;
            case "lac_dan":
                redDot -= 3; scope2x -= 3;
                tips.push("• **Lạc đạn:** Đặt tâm ngang ngực trước khi kéo, không nhấp sấy liên tục.");
                break;
            case "truot_dich":
                look += 4; redDot += 3;
                tips.push("• **Trượt địch:** Giữ khoảng cách tầm trung và kéo tâm thẳng đứng.");
                break;
        }
    });

    // Giới hạn trong khoảng 50 - 100 trong game
    look = Math.min(100, Math.max(50, look));
    redDot = Math.min(100, Math.max(50, redDot));
    scope2x = Math.min(100, Math.max(50, scope2x));
    scope4x = Math.min(100, Math.max(50, scope4x));
    btnSize = Math.min(60, Math.max(40, btnSize));

    // Xuất kết quả
    document.getElementById("resDevice").innerText = device;
    document.getElementById("resDpi").innerText = dpi;
    document.getElementById("resLook").innerText = look;
    document.getElementById("resRedDot").innerText = redDot;
    document.getElementById("res2x").innerText = scope2x;
    document.getElementById("res4x").innerText = scope4x;
    document.getElementById("resButton").innerText = btnSize + "%";
    document.getElementById("resTip").innerHTML = tips.length > 0 ? tips.join("<br>") : "Đã tối ưu cấu hình mặc định!";

    document.getElementById("resultBox").style.display = "block";
}
</script>

</body>
</html>
