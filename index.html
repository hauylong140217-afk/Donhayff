<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tối Ưu Độ Nhạy FF - Full Model Check</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: #0d0f12;
            background-image: radial-gradient(circle at 50% 0%, #2a0845 0%, #0d0f12 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 20px;
            padding: 30px 25px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 71, 87, 0.15);
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.6);
        }

        .title span {
            color: #ff4757;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #a4b0be;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background: #161d24;
            border: 1px solid #2f3542;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #ff4757;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.3);
        }

        .note-text {
            font-size: 11px;
            color: #ffaa00;
            margin-top: 6px;
            display: block;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #161d24;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #2f3542;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #ccc;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #ff4757;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
        }

        .result-card {
            display: none;
            margin-top: 25px;
            background: #12181f;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2f3542;
            animation: fadeIn 0.4s ease-in-out;
        }

        .error-card {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid #ff4757;
            color: #ff6b81;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #2f3542;
            padding-bottom: 10px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .result-header span {
            color: #ff4757;
            font-weight: bold;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-item {
            background: #1a222d;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-size: 12px;
            color: #a4b0be;
        }

        .stat-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: bold;
            color: #2ed573;
        }

        .tip-box {
            margin-top: 15px;
            background: rgba(255, 71, 87, 0.1);
            border-left: 3px solid #ff4757;
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
            font-size: 12px;
            color: #ff6b81;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">Độ Nhạy <span>FF Full Red</span></div>

    <div class="input-group">
        <label for="device">Tên Tên Máy Đầy Đủ</label>
        <input type="text" id="device" placeholder="VD: Samsung Galaxy Tab S9 FE, iPhone 15 Pro Max...">
    </div>

    <div class="input-group">
        <label for="dpi">Chỉ Số DPI</label>
        <input type="number" id="dpi" placeholder="Nhập DPI thực tế">
        <span class="note-text">⚠️ Hệ thống dpi có sai sót vui lòng chỉnh lại một chút</span>
    </div>

    <div class="input-group">
        <label>Chọn Tình Trạng Khi Bắn:</label>
        <div class="checkbox-grid">
            <label class="checkbox-item"><input type="checkbox" value="nang_tam"> Nặng tâm</label>
            <label class="checkbox-item"><input type="checkbox" value="lo_dau"> Lố đầu</label>
            <label class="checkbox-item"><input type="checkbox" value="giat_tam"> Giật tâm</label>
            <label class="checkbox-item"><input type="checkbox" value="rung_tay"> Rung tay</label>
            <label class="checkbox-item"><input type="checkbox" value="lac_dan"> Lạc đạn</label>
            <label class="checkbox-item"><input type="checkbox" value="truot_dich"> Trượt địch</label>
        </div>
    </div>

    <button onclick="tinhDoNhay()">KÍCH HOẠT CHẾ ĐỘ FULL RED</button>

    <div id="resultBox" class="result-card"></div>
</div>

<script>
// Danh sách các hãng máy
const validBrands = [
    "samsung", "apple", "iphone", "ipad", "vivo", "xiaomi", "redmi", "poco", 
    "oppo", "realme", "asus", "rog", "iqoo", "tecno", "infinix", "huawei", 
    "honor", "oneplus", "google", "pixel", "sony", "lenovo"
];

// Từ khóa định danh model hợp lệ
const validModels = [
    "galaxy", "tab", "fe", "note", "ultra", "plus", "pro", "max", "mini", 
    "pad", "fold", "flip", "series", "neo", "magic", "number", "gaming", "s9", "s8", "s10", "s21", "s22", "s23", "s24"
];

window.onload = function() {
    let ratio = window.devicePixelRatio || 1;
    let estimatedDpi = Math.round(320 * ratio);
    document.getElementById("dpi").value = estimatedDpi;
};

function tinhDoNhay() {
    let inputDevice = document.getElementById("device").value.trim();
    let resultBox = document.getElementById("resultBox");

    if (!inputDevice) {
        resultBox.className = "result-card error-card";
        resultBox.innerHTML = "⚠️ Vui lòng nhập tên điện thoại hoặc máy tính bảng!";
        resultBox.style.display = "block";
        return;
    }

    let lowerInput = inputDevice.toLowerCase();

    // Kiếm tra xem có tên Hãng trong input không
    let hasBrand = validBrands.some(brand => lowerInput.includes(brand));
    
    // Kiểm tra xem có ký tự số (dòng máy) hoặc từ khóa model không
    let hasNumberOrModel = /\d/.test(lowerInput) || validModels.some(model => lowerInput.includes(model));

    // Nếu không khớp hãng HOẶC thiếu tên dòng máy cụ thể
    if (!hasBrand || !hasNumberOrModel) {
        resultBox.className = "result-card error-card";
        resultBox.innerHTML = "❌ Điện thoại không tồn tại trong hệ thống! Vui lòng nhập đầy đủ tên máy (VD: Samsung Galaxy Tab S9 FE, Vivo Y20...)";
        resultBox.style.display = "block";
        return;
    }

    let dpi = parseInt(document.getElementById("dpi").value) || 400;
    let selectedBoxes = document.querySelectorAll('.checkbox-grid input[type="checkbox"]:checked');
    let selectedStatuses = Array.from(selectedBoxes).map(cb => cb.value);

    // Tối ưu riêng cho Màn hình lớn/Máy tính bảng (Tab/Pad)
    let isTablet = lowerInput.includes("tab") || lowerInput.includes("pad") || lowerInput.includes("ipad");
    
    let look = isTablet ? 185 : 195;
    let redDot = isTablet ? 180 : 190;
    let scope2x = isTablet ? 170 : 180;
    let scope4x = isTablet ? 155 : 165;
    let sniper = 120;
    let freeLook = 100;
    let btnSize = isTablet ? 45 : 38;

    if (selectedStatuses.includes("lo_dau") || selectedStatuses.includes("giat_tam")) {
        look -= 10;
        redDot -= 10;
        btnSize += 2;
    }

    if (selectedStatuses.includes("nang_tam") || selectedStatuses.includes("truot_dich")) {
        look = 200;
        redDot = 198;
        btnSize -= 2;
    }

    look = Math.min(200, Math.max(0, look));
    redDot = Math.min(200, Math.max(0, redDot));
    scope2x = Math.min(200, Math.max(0, scope2x));
    scope4x = Math.min(200, Math.max(0, scope4x));
    sniper = Math.min(200, Math.max(0, sniper));

    resultBox.className = "result-card";
    resultBox.innerHTML = `
        <div class="result-header">
            <div>Thiết bị: <span>${inputDevice}</span></div>
            <div>DPI: <span>${dpi}</span></div>
        </div>

        <div class="stat-grid">
            <div class="stat-item"><span class="stat-label">Nhìn xung quanh</span><span class="stat-val">${look}</span></div>
            <div class="stat-item"><span class="stat-label">Red Dot Sight</span><span class="stat-val">${redDot}</span></div>
            <div class="stat-item"><span class="stat-label">Ống ngắm 2x</span><span class="stat-val">${scope2x}</span></div>
            <div class="stat-item"><span class="stat-label">Ống ngắm 4x</span><span class="stat-val">${scope4x}</span></div>
            <div class="stat-item"><span class="stat-label">Ống ngắm Sniper</span><span class="stat-val">${sniper}</span></div>
            <div class="stat-item"><span class="stat-label">Nhìn tự do</span><span class="stat-val">${freeLook}</span></div>
            <div class="stat-item" style="grid-column: span 2;"><span class="stat-label">Kích thước nút bắn</span><span class="stat-val" style="color: #ff4757;">${btnSize}%</span></div>
        </div>

        <div class="tip-box">
            🎯 <b>Mẹo thoát máu vàng cho ${inputDevice}:</b><br>
            1. Đặt kích thước nút bắn ở mức <b>${btnSize}%</b> và kéo sát xuống cạnh dưới.<br>
            2. Màn hình tablet/điện thoại lớn nên vuốt lực vừa phải, đặt tâm ngang tầm ngực địch trước khi kéo.
        </div>
    `;

    resultBox.style.display = "block";
}
</script>

</body>
</html>
