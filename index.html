<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tối Ưu Độ Nhạy Free Fire 200 Max</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: #0d0f12;
            background-image: radial-gradient(circle at 50% 0%, #2a0845 0%, #0d0f12 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 20px;
            padding: 30px 25px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 71, 87, 0.15);
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.6);
        }

        .title span {
            color: #ff4757;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #a4b0be;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background: #161d24;
            border: 1px solid #2f3542;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #ff4757;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.3);
        }

        .note-text {
            font-size: 11px;
            color: #ffaa00;
            margin-top: 6px;
            display: block;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #161d24;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #2f3542;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #ccc;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #ff4757;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
        }

        .result-card {
            display: none;
            margin-top: 25px;
            background: #12181f;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2f3542;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #2f3542;
            padding-bottom: 10px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .result-header span {
            color: #ff4757;
            font-weight: bold;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-item {
            background: #1a222d;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-size: 12px;
            color: #a4b0be;
        }

        .stat-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: bold;
            color: #2ed573;
        }

        .tip-box {
            margin-top: 15px;
            background: rgba(255, 171, 0, 0.1);
            border-left: 3px solid #ffab00;
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
            font-size: 12px;
            color: #eccc68;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">Độ Nhạy <span>FF Max 200</span></div>

    <div class="input-group">
        <label for="device">Dòng Điện Thoại</label>
        <input type="text" id="device" placeholder="VD: Vivo, iPhone, Samsung...">
    </div>

    <div class="input-group">
        <label for="dpi">Chỉ Số DPI</label>
        <input type="number" id="dpi" placeholder="Nhập DPI thực tế">
        <span class="note-text">⚠️ Hệ thống dpi có sai sót vui lòng chỉnh lại một chút</span>
    </div>

    <div class="input-group">
        <label>Chọn Tình Trạng Khi Bắn (Chọn nhiều ô):</label>
        <div class="checkbox-grid">
            <label class="checkbox-item"><input type="checkbox" value="nang_tam"> Nặng tâm</label>
            <label class="checkbox-item"><input type="checkbox" value="lo_dau"> Lố đầu</label>
            <label class="checkbox-item"><input type="checkbox" value="giat_tam"> Giật tâm</label>
            <label class="checkbox-item"><input type="checkbox" value="rung_tay"> Rung tay</label>
            <label class="checkbox-item"><input type="checkbox" value="lac_dan"> Lạc đạn</label>
            <label class="checkbox-item"><input type="checkbox" value="truot_dich"> Trượt địch</label>
        </div>
    </div>

    <button onclick="tinhDoNhay()">TÍNH ĐỘ NHẠY FULL ĐỎ (0-200)</button>

    <div id="resultBox" class="result-card">
        <div class="result-header">
            <div>Thiết bị: <span id="resDevice"></span></div>
            <div>DPI: <span id="resDpi"></span></div>
        </div>

        <div class="stat-grid">
            <div class="stat-item"><span class="stat-label">Nhìn xung quanh</span><span id="resLook" class="stat-val">0</span></div>
            <div class="stat-item"><span class="stat-label">Red Dot Sight</span><span id="resRedDot" class="stat-val">0</span></div>
            <div class="stat-item"><span class="stat-label">Ống ngắm 2x</span><span id="res2x" class="stat-val">0</span></div>
            <div class="stat-item"><span class="stat-label">Ống ngắm 4x</span><span id="res4x" class="stat-val">0</span></div>
            <div class="stat-item"><span class="stat-label">Ống ngắm Sniper</span><span id="resSniper" class="stat-val">0</span></div>
            <div class="stat-item"><span class="stat-label">Nhìn tự do</span><span id="resFreeLook" class="stat-val">0</span></div>
            <div class="stat-item" style="grid-column: span 2;"><span class="stat-label">Kích thước nút bắn</span><span id="resButton" class="stat-val" style="color: #ff4757;">0%</span></div>
        </div>

        <div id="resTip" class="tip-box"></div>
    </div>
</div>

<script>
window.onload = function() {
    let ratio = window.devicePixelRatio || 1;
    let estimatedDpi = Math.round(320 * ratio);
    document.getElementById("dpi").value = estimatedDpi;
};

function tinhDoNhay() {
    let device = document.getElementById("device").value || "Thiết bị chung";
    let dpi = parseInt(document.getElementById("dpi").value) || 400;

    let selectedBoxes = document.querySelectorAll('.checkbox-grid input[type="checkbox"]:checked');
    let selectedStatuses = Array.from(selectedBoxes).map(cb => cb.value);

    // Công thức quy đổi tối ưu cho hệ thang đo 0 - 200
    let look = Math.max(120, Math.min(195, Math.round(190 - (dpi - 360) * 0.07)));
    let redDot = look - 8;
    let scope2x = look - 14;
    let scope4x = look - 24;
    let sniper = Math.max(70, Math.min(130, Math.round(120 - (dpi - 360) * 0.04)));
    let freeLook = 100;
    let btnSize = 44;
    let tips = [];

    if (selectedStatuses.length === 0) {
        tips.push("• **Mẹo:** Tích chọn ít nhất 1 tình trạng bắn để thuật toán căn chỉnh thang 200 chuẩn nhất.");
    }

    selectedStatuses.forEach(status => {
        switch(status) {
            case "nang_tam":
                look += 14; redDot += 12; btnSize -= 2;
                tips.push("• **Nặng tâm:** Hạ nút bắn thấp hơn 5% so với vị trí cũ để tăng biên độ kéo.");
                break;
            case "lo_dau":
                look -= 12; redDot -= 14; btnSize += 3;
                tips.push("• **Lố đầu:** Tăng kích thước nút bắn giúp kìm độ văng của đạn.");
                break;
            case "giat_tam":
                look -= 8; redDot -= 10; sniper -= 10;
                tips.push("• **Giật tâm:** Vuốt nhẹ nút bắn theo nhịp ngắn, tránh kéo giật mạnh.");
                break;
            case "rung_tay":
                look -= 10; redDot -= 10; btnSize += 4; freeLook -= 20;
                tips.push("• **Rung tay:** Tăng nút bắn to giúp ngón tay giữ vững tâm súng hơn.");
                break;
            case "lac_dan":
                redDot -= 8; scope2x -= 8; scope4x -= 8;
                tips.push("• **Lạc đạn:** Đặt tâm súng ngang ngực địch rồi mới nhấn vuốt thẳng.");
                break;
            case "truot_dich":
                look += 10; redDot += 8; sniper += 10;
                tips.push("• **Trượt địch:** Giữ khoảng cách tầm trung và kéo tâm theo đường thẳng.");
                break;
        }
    });

    // Giới hạn giá trị nằm chuẩn trong khoảng 0 - 200
    look = Math.min(200, Math.max(0, look));
    redDot = Math.min(200, Math.max(0, redDot));
    scope2x = Math.min(200, Math.max(0, scope2x));
    scope4x = Math.min(200, Math.max(0, scope4x));
    sniper = Math.min(200, Math.max(0, sniper));
    freeLook = Math.min(200, Math.max(0, freeLook));
    btnSize = Math.min(60, Math.max(40, btnSize));

    document.getElementById("resDevice").innerText = device;
    document.getElementById("resDpi").innerText = dpi;
    document.getElementById("resLook").innerText = look;
    document.getElementById("resRedDot").innerText = redDot;
    document.getElementById("res2x").innerText = scope2x;
    document.getElementById("res4x").innerText = scope4x;
    document.getElementById("resSniper").innerText = sniper;
    document.getElementById("resFreeLook").innerText = freeLook;
    document.getElementById("resButton").innerText = btnSize + "%";
    document.getElementById("resTip").innerHTML = tips.length > 0 ? tips.join("<br>") : "Đã tối ưu thông số thang 200 cho tỉ lệ bắn đỏ tối đa!";

    document.getElementById("resultBox").style.display = "block";
}
</script>

</body>
</html>
