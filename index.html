<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tối Ưu Độ Nhạy FF - Ultra Auto Headshot</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: #090a0f;
            background-image: radial-gradient(circle at 50% 0%, #3a0007 0%, #090a0f 80%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            background: rgba(18, 20, 29, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 42, 60, 0.4);
            border-radius: 20px;
            padding: 30px 25px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 42, 60, 0.25);
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            font-size: 21px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 22px;
            text-shadow: 0 0 12px rgba(255, 42, 60, 0.8);
        }

        .title span {
            color: #ff2a3c;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #a4b0be;
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px 16px;
            background: #12151e;
            border: 1px solid #282d3c;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        select option {
            background: #12151e;
            color: #fff;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: #ff2a3c;
            box-shadow: 0 0 12px rgba(255, 42, 60, 0.4);
        }

        .auto-tag {
            display: inline-block;
            font-size: 10px;
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 6px;
            text-transform: none;
            font-weight: 600;
        }

        .note-text {
            font-size: 11px;
            color: #ffb100;
            margin-top: 5px;
            display: block;
            font-weight: 500;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #12151e;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #282d3c;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 12px;
            color: #dcdde1;
        }

        .checkbox-item input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #ff2a3c;
            cursor: pointer;
        }

        .btn-main {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff2a3c, #ff6b6b);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 5px 20px rgba(255, 42, 60, 0.5);
            transition: all 0.3s ease;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 42, 60, 0.8);
        }

        .result-card {
            display: none;
            margin-top: 22px;
            background: #0d1017;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid #ff2a3c;
            animation: fadeIn 0.35s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #282d3c;
            padding-bottom: 8px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .result-header span {
            color: #ff2a3c;
            font-weight: bold;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-item {
            background: #171b26;
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-label {
            font-size: 11px;
            color: #a4b0be;
        }

        .stat-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 800;
            color: #00ff88;
        }

        .tip-box {
            margin-top: 14px;
            background: rgba(255, 42, 60, 0.08);
            border-left: 3px solid #ff2a3c;
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
            font-size: 12px;
            color: #ff7675;
            line-height: 1.5;
        }

        .ultra-badge {
            display: block;
            text-align: center;
            background: linear-gradient(90deg, #ff2a3c, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 13px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">Độ Nhạy <span>Ultra Headshot</span></div>

    <div class="input-group">
        <label for="device">Máy Đang Dùng <span class="auto-tag">⚡ Tự nhận dạng</span></label>
        <input type="text" id="device" placeholder="Đang đọc thiết bị...">
    </div>

    <div class="input-group">
        <label for="gunType">Chế Độ Bắn Đặc Biệt</label>
        <select id="gunType">
            <option value="m1887">💥 M1887 / M590 / Shotgun (One-Shot Siêu Nhẹ)</option>
            <option value="smg">⚡ MP40 / MP5 / Thompson (Sấy Khóa Đầu)</option>
            <option value="one_shot">☠️ Desert Eagle / Woodpecker (Vẩy Tâm Chữ U)</option>
            <option value="ar">🎯 Súng Trường (AK, M4A1, GROZA - Đầm Tâm)</option>
            <option value="all">🔥 All Súng (Cân Bằng Siêu Tốc)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="dpi">Chỉ Số DPI Máy</label>
        <input type="number" id="dpi" placeholder="Nhập DPI thực tế">
        <span class="note-text">⚡ Mẹo: Tăng DPI trong Cài đặt nhà phát triển lên 480 - 560 để cảm ứng siêu nhạy.</span>
    </div>

    <div class="input-group">
        <label>Tình Trạng Cần Bẻ Cong Tâm:</label>
        <div class="checkbox-grid">
            <label class="checkbox-item"><input type="checkbox" value="nang_tam" checked> Nặng tâm (Dính ngực)</label>
            <label class="checkbox-item"><input type="checkbox" value="lo_dau"> Lố đầu (Bay qua đầu)</label>
            <label class="checkbox-item"><input type="checkbox" value="giat_tam"> Giật tâm / Rung màn</label>
            <label class="checkbox-item"><input type="checkbox" value="truot_dich"> Trượt lệch tâm</label>
        </div>
    </div>

    <button class="btn-main" onclick="tinhDoNhay()">KÍCH HOẠT THUẬT TOÁN FULL RED</button>

    <div id="resultBox" class="result-card"></div>
</div>

<script>
window.onload = function() {
    let ua = navigator.userAgent.toLowerCase();
    let detectedDevice = "Thiết bị Di Động";

    if (ua.includes("vivo")) detectedDevice = "Vivo (Cảm ứng cao)";
    else if (ua.includes("samsung")) detectedDevice = "Samsung Galaxy";
    else if (ua.includes("iphone")) detectedDevice = "iPhone (iOS Speed)";
    else if (ua.includes("ipad")) detectedDevice = "iPad (Màn rộng)";
    else if (ua.includes("xiaomi") || ua.includes("redmi")) detectedDevice = "Xiaomi / Redmi";
    else if (ua.includes("oppo")) detectedDevice = "OPPO";
    else if (ua.includes("realme")) detectedDevice = "Realme";

    document.getElementById("device").value = detectedDevice;

    let ratio = window.devicePixelRatio || 1;
    let estimatedDpi = Math.round(360 * ratio);
    document.getElementById("dpi").value = estimatedDpi;
};

function tinhDoNhay() {
    let inputDevice = document.getElementById("device").value.trim();
    let gunType = document.getElementById("gunType").value;
    let resultBox = document.getElementById("resultBox");

    let lowerInput = inputDevice.toLowerCase();
    let dpi = parseInt(document.getElementById("dpi").value) || 450;
    let selectedBoxes = document.querySelectorAll('.checkbox-grid input[type="checkbox"]:checked');
    let selectedStatuses = Array.from(selectedBoxes).map(cb => cb.value);

    let isTablet = lowerInput.includes("tab") || lowerInput.includes("pad") || lowerInput.includes("ipad");

    // Thuật toán Ultra: Max nhạy để loại bỏ hoàn toàn ma sát màn hình
    let look = 200;
    let redDot = 200;
    let scope2x = 200;
    let scope4x = 190;
    let sniper = 130;
    let freeLook = 100;
    let btnSize = isTablet ? 32 : 28; // Giảm diện tích nút bấm siêu nhỏ để tăng lực vuốt
    let gunTip = "";

    switch (gunType) {
        case "m1887":
            btnSize = isTablet ? 30 : 26;
            gunTip = "<b>Kỹ Thuật M1887 Full Red:</b> Đặt tâm màu TRẮNG lệch sang bên trái/phải sườn địch 1 khoảng ngắn. Nhấn giữ nút bắn và <b>móc nhanh theo đường cong chữ J</b> hướng thẳng lên đầu.";
            break;
        case "smg":
            btnSize = isTablet ? 34 : 29;
            gunTip = "<b>Kỹ Thuật MP40/MP5 Sấy Đầu:</b> Để tâm TRẮNG dưới chân địch. Vuốt nút bắn một lực vừa đủ thẳng đứng lên trên, khi tâm chớm đỏ thì thả nhẹ lực vuốt để ghìm đạn vào đầu.";
            break;
        case "one_shot":
            btnSize = isTablet ? 28 : 25;
            gunTip = "<b>Kỹ Thuật One-Shot Desert Eagle:</b> Đặt nút bắn kích thước 25-28% ở góc thấp nhất. Đặt tâm ngang vai địch rồi <b>vẩy thật dứt khoát</b> lên đỉnh màn hình.";
            break;
        case "ar":
            btnSize = isTablet ? 36 : 32;
            gunTip = "<b>Kỹ Thuật Súng Trường:</b> Nhấp nhả nút bắn theo nhịp 3 viên (Tap-fire). Đặt tâm màu đỏ ngang ngực rồi vuốt nhẹ lên.";
            break;
        default:
            gunTip = "<b>Mẹo Siêu Kéo Tâm:</b> Luôn giữ tâm ở dạng màu TRẮNG trước khi kéo. Nếu tâm dính màu ĐỎ vào ngực trước khi vuốt, đạn sẽ bị nặng tâm 100%.";
            break;
    }

    if (selectedStatuses.includes("lo_dau")) {
        redDot -= 5;
        btnSize += 2;
    }

    if (selectedStatuses.includes("nang_tam")) {
        look = 200;
        redDot = 200;
        btnSize = Math.max(24, btnSize - 2);
    }

    resultBox.className = "result-card";
    resultBox.innerHTML = `
        <span class="ultra-badge">⚡ ULTRA ENGINE HEADSHOT ACTIVATED ⚡</span>
        <div class="result-header">
            <div>Cấu hình: <span>${inputDevice}</span></div>
            <div>DPI Đề Xuất: <span>${dpi}</span></div>
        </div>

        <div class="stat-grid">
            <div class="stat-item"><span class="stat-label">Nhìn xung quanh</span><span class="stat-val">${look}</span></div>
            <div class="stat-item"><span class="stat-label">Red Dot Sight</span><span class="stat-val">${redDot}</span></div>
            <div class="stat-item"><span class="stat-label">Ống ngắm 2x</span><span class="stat-val">${scope2x}</span></div>
            <div class="stat-item"><span class="stat-label">Ống ngắm 4x</span><span class="stat-val">${scope4x}</span></div>
            <div class="stat-item"><span class="stat-label">Ống ngắm Sniper</span><span class="stat-val">${sniper}</span></div>
            <div class="stat-item"><span class="stat-label">Nhìn tự do</span><span class="stat-val">${freeLook}</span></div>
            <div class="stat-item" style="grid-column: span 2; border: 1px solid rgba(0,255,136,0.3);"><span class="stat-label" style="color:#00ff88;">Kích thước nút bắn Ultra</span><span class="stat-val" style="color: #ff2a3c; font-size: 18px;">${btnSize}%</span></div>
        </div>

        <div class="tip-box">
            🎯 <b>CÁCH KÉO TÂM SIÊU ĐỈNH (FULL RED 100%):</b><br>
            1. Hạ nút bắn xuống kích thước chuẩn <b>${btnSize}%</b> và đặt kéo sát mép dưới màn hình.<br>
            2. ${gunTip}<br>
            3. <b>Mẹo vật lý:</b> Lau sạch màn hình hoặc thoa một ít phấn rôm để ngón tay lướt siêu mượt không bị rít.
        </div>
    `;

    resultBox.style.display = "block";
}
</script>

</body>
</html>
